<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Beyond Sauvignon Blanc | Wine Up</title>

<meta name="description" content="Beyond Sauvignon Blanc by Wine Up. Join us at Stubby's London on 15 September 2026.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --cream: #f3e7d3;
  --green: #35472c;
  --light: #faf4e8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--green);
  font-family: "Oswald", Arial, sans-serif;
}

/* WINE UP HEADER */

.brand-header {
  width: min(900px, calc(100% - 32px));
  margin: 0 auto;
  padding: 46px 0 26px;
  text-align: center;
}

.logo {
  display: block;
  width: min(275px, 68vw);
  height: auto;
  margin: 0 auto;
}

.brand-description {
  margin: 20px 0 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .24em;
  text-transform: uppercase;
}

/* SEPARATION LINE */

.divider {
  display: flex;
  align-items: center;
  gap: 15px;
  width: min(760px, calc(100% - 44px));
  margin: 5px auto 42px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--green);
  opacity: .65;
}

.divider span {
  width: 9px;
  height: 9px;
  background: var(--green);
  transform: rotate(45deg);
}

/* EVENT POSTER */

main {
  width: min(820px, calc(100% - 30px));
  margin: 0 auto;
  padding-bottom: 55px;
}

.poster-frame {
  padding: 10px;
  background: var(--light);
  border: 2px solid var(--green);
  box-shadow: 0 14px 35px rgba(53, 71, 44, .14);
}

.poster {
  display: block;
  width: 100%;
  height: auto;
}

/* BOOKING */

.booking-section {
  padding: 36px 20px 0;
  text-align: center;
}

.booking-text {
  margin: 0 0 21px;
  font-size: 18px;
  font-weight: 500;
}

.book-button {
  display: inline-block;
  padding: 16px 44px;
  background: var(--green);
  color: var(--cream);
  border: 2px solid var(--green);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .11em;
  text-decoration: none;
  text-transform: uppercase;
  transition: .2s ease;
}

.book-button:hover {
  background: transparent;
  color: var(--green);
}

/* CONTACTS */

footer {
  margin-top: 47px;
  text-align: center;
  font-size: 14px;
  line-height: 2;
}

footer a {
  color: var(--green);
  text-decoration: none;
  border-bottom: 1px solid rgba(53, 71, 44, .45);
}

@media (max-width: 650px) {
  .brand-header {
    padding-top: 34px;
  }

  .divider {
    margin-bottom: 30px;
  }

  main {
    width: min(100% - 20px, 820px);
  }

  .poster-frame {
    padding: 5px;
  }

  .booking-section {
    padding: 29px 8px 0;
  }

  .book-button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header class="brand-header">
  <img
    class="logo"
    src="wineup-logo.png"
    alt="Wine Up">

  <p class="brand-description">
    Curated wine experiences
  </p>
</header>

<div class="divider" aria-hidden="true">
  <span></span>
</div>

<main>

  <div class="poster-frame">
    <img
      class="poster"
      src="beyond-sauvignon-blanc-web.png"
      alt="Beyond Sauvignon Blanc wine tasting at Stubby's on 15 September 2026">
  </div>

  <section class="booking-section">
    <p class="booking-text">
      Ready to discover your next favourite white?
    </p>

    <a
      class="book-button"
      href="https://checkout.square.site/merchant/MLZSPPA3CY54X/checkout/CKHLHPHBFSNTNXLIETANJMHJ"
      target="_blank"
      rel="noopener noreferrer">
      Book your place
    </a>
  </section>

  <footer>
    <a href="mailto:stefania@wineup.uk">
      stefania@wineup.uk
    </a><br>

    <a
      href="https://www.instagram.com/wineup.uk/"
      target="_blank"
      rel="noopener noreferrer">
      Instagram · @wineup.uk
    </a>
  </footer>

</main>

</body>
</html>
