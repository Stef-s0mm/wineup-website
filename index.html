<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Beyond Sauvignon Blanc | Wine Up</title>

<meta
  name="description"
  content="Beyond Sauvignon Blanc by Wine Up. Join us at Stubby's London on 15 September 2026.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
  rel="stylesheet">

<style>
:root {
  --cream: #f3e7d3;
  --green: #35472c;
  --light: #faf4e8;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background: var(--cream);
  color: var(--green);
  font-family: "Oswald", Arial, sans-serif;
}

/* WINE UP LOGO */

.brand-header {
  width: min(700px, calc(100% - 30px));
  margin: 0 auto;
  padding: 14px 0 4px;
  text-align: center;
}

.logo {
  display: block;
  width: min(210px, 58vw);
  height: auto;
  margin: 0 auto;
}

.brand-description {
  margin: 7px 0 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
}

/* LINEA DI SEPARAZIONE */

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(500px, calc(100% - 40px));
  margin: 0 auto 8px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--green);
  opacity: .6;
}

.divider span {
  width: 7px;
  height: 7px;
  background: var(--green);
  transform: rotate(45deg);
}

/* MAIN CONTENT */

main {
  width: min(620px, calc(100% - 24px));
  margin: 0 auto;
  padding-bottom: 18px;
  text-align: center;
}

/* LOCANDINA */

/*
  Il calcolo basato sull’altezza dello schermo permette
  alla locandina di essere grande e leggibile, senza
  occupare più del 70% della schermata.
*/

.poster-frame {
  width: min(520px, 100%, 49.4vh);
  width: min(520px, 100%, 49.4svh);
  margin: 0 auto;
  padding: 5px;
  background: var(--light);
  border: 2px solid var(--green);
  box-shadow: 0 8px 22px rgba(53, 71, 44, .13);
}

.poster {
  display: block;
  width: 100%;
  height: auto;
}

/* PRENOTAZIONE */

.booking-section {
  padding: 13px 8px 0;
  text-align: center;
}

.book-button {
  display: inline-block;
  padding: 12px 38px;
  background: var(--green);
  color: var(--cream);
  border: 2px solid var(--green);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .11em;
  text-decoration: none;
  text-transform: uppercase;
  transition: .2s ease;
}

.book-button:hover {
  background: transparent;
  color: var(--green);
}

/* CONTATTI */

footer {
  margin-top: 14px;
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
}

footer a {
  color: var(--green);
  text-decoration: none;
  border-bottom: 1px solid rgba(53, 71, 44, .4);
}

/* TELEFONO */

@media (max-width: 650px) {
  .brand-header {
    padding-top: 10px;
    padding-bottom: 3px;
  }

  .logo {
    width: min(180px, 52vw);
  }

  .brand-description {
    margin-top: 5px;
    font-size: 10px;
  }

  .divider {
    margin-bottom: 6px;
  }

  main {
    width: min(100% - 16px, 620px);
  }

  .poster-frame {
    width: min(100%, 46.5svh);
    padding: 4px;
  }

  .booking-section {
    padding-top: 10px;
  }

  .book-button {
    width: min(100%, 330px);
  }

  footer {
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<header class="brand-header">
  <img
    class="logo"
    src="wineup-logo.png"
    alt="Wine Up">

  <p class="brand-description">
    Curated wine experiences
  </p>
</header>

<div class="divider" aria-hidden="true">
  <span></span>
</div>

<main>

  <div class="poster-frame">
    <img
      class="poster"
      src="beyond-sauvignon-blanc-web.png"
      alt="Beyond Sauvignon Blanc wine tasting at Stubby's on 15 September 2026">
  </div>

  <section class="booking-section">
    <a
      class="book-button"
      href="https://checkout.square.site/merchant/MLZSPPA3CY54X/checkout/CKHLHPHBFSNTNXLIETANJMHJ"
      target="_blank"
      rel="noopener noreferrer">
      Book your place
    </a>
  </section>

  <footer>
    <a href="mailto:stefania@wineup.uk">
      stefania@wineup.uk
    </a><br>

    <a
      href="https://www.instagram.com/wineup.uk/"
      target="_blank"
      rel="noopener noreferrer">
      Instagram · @wineup.uk
    </a>
  </footer>

</main>

</body>
</html>
