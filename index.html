<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wine Up — Coming Soon</title>
<meta name="description" content="Curated wine experiences in London. Corporate events, private tastings and wine education.">
<style>
:root{--cream:#efe6d6;--green:#5d642f;--text:#2f3320}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:32px 20px}
main{width:min(760px,100%);text-align:center;animation:fadeIn 1.2s ease both}
.logo{display:block;width:min(260px,65vw);height:auto;margin:0 auto 34px}
h1{margin:0 0 16px;font-size:clamp(28px,4vw,46px);line-height:1.15;font-weight:500;letter-spacing:.02em}
.services{margin:0 auto 28px;max-width:620px;font-size:clamp(15px,2vw,18px);line-height:1.7;letter-spacing:.02em}
.coming{margin:0 0 30px;font-size:14px;text-transform:uppercase;letter-spacing:.18em;color:var(--green)}
a{color:var(--green);text-decoration:none;border-bottom:1px solid rgba(93,100,47,.4);padding-bottom:2px}
footer{margin-top:34px;font-size:13px;opacity:.75}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main>
<img class="logo" src="wineup-logo.png" alt="Wine Up logo">
<h1>Curated wine experiences in London.</h1>
<p class="services">Corporate events · Private tastings · Wine education</p>
<p class="coming">Website coming soon</p>
<p><a href="mailto:stefania@wineup.uk">stefania@wineup.uk</a></p>
<footer>Wine Up · London</footer>
</main>
</body>
</html>
